<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📢 Create News Post - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-3xl mx-auto bg-white shadow-lg rounded-lg p-8">

        <h1 class="text-3xl font-bold mb-6 text-center">📢 Create News Post</h1>

        <form method="POST" enctype="multipart/form-data" class="space-y-6">

            <!-- Title -->
            <div>
                <label for="title" class="block font-semibold mb-1">Title</label>
                <input type="text" id="title" name="title" required
                    class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- Author -->
            <div>
                <label for="author" class="block font-semibold mb-1">Author</label>
                <input type="text" id="author" name="author" required
                    class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Enter author name">
            </div>

            <!-- Description -->
            <div>
                <label for="description" class="block font-semibold mb-1">Description</label>
                <textarea id="description" name="description" rows="6" required
                    class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Write your news content here..."></textarea>
            </div>

            <!-- Main Image Upload -->
            <div>
                <label for="image" class="block font-semibold mb-1">Main Image (optional)</label>
                <input type="file" id="image" name="image" accept="image/*" class="w-full" onchange="previewImage('image', 'imagePreview')">
            </div>

            <!-- Main Image Preview -->
            <div id="imagePreview" class="mt-4 hidden">
                <img src="" alt="Main Image Preview" class="w-full max-h-64 object-cover rounded shadow">
            </div>

            <!-- Extra Images Upload -->
            <div>
                <label class="block font-semibold mb-1">Extra Images (optional)</label>
                <input type="file" name="extra_images" accept="image/*" multiple class="w-full" onchange="previewExtraImages(event)">
            </div>

            <!-- Extra Images Preview -->
            <div id="extraImagesPreview" class="mt-4 flex flex-wrap gap-4"></div>

            <!-- Post Type -->
            <div>
                <label for="post_type" class="block font-semibold mb-1">Post Type</label>
                <select id="post_type" name="post_type"
                    class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="announcement">Announcement</option>
                    <option value="event">Event</option>
                    <option value="achievement">Achievement</option>
                    <option value="holiday">Holiday</option>
                </select>
            </div>
            <div class="mb-4">
  <label for="instagram_url" class="block text-sm font-medium text-gray-700">Instagram Link</label>
  <input type="url" name="instagram_url" id="instagram_url"
         class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
         placeholder="https://instagram.com/username">
</div>

<div class="mb-4">
  <label for="website_url" class="block text-sm font-medium text-gray-700">Website Link</label>
  <input type="url" name="website_url" id="website_url"
         class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
         placeholder="https://example.com">
</div>


            <!-- Pin Post -->
            <div class="flex items-center">
                <input type="checkbox" id="is_pinned" name="is_pinned" class="mr-2">
                <label for="is_pinned" class="font-semibold">Pin this post</label>
            </div>

            <!-- Submit Button -->
            <div class="text-center">
                <button type="submit"
                    class="bg-indigo-600 text-white px-6 py-3 rounded font-semibold hover:bg-indigo-700 transition">
                    ✅ Publish News
                </button>
            </div>
        </form>

    </div>

    <script>
        // Preview main image
        function previewImage(inputId, previewId) {
            const input = document.getElementById(inputId);
            const preview = document.getElementById(previewId);
            const img = preview.querySelector('img');
            const file = input.files[0];

            if (file) {
                img.src = URL.createObjectURL(file);
                preview.classList.remove('hidden');
            } else {
                preview.classList.add('hidden');
                img.src = '';
            }
        }

        // Preview multiple extra images
        function previewExtraImages(event) {
            const files = event.target.files;
            const previewContainer = document.getElementById('extraImagesPreview');
            previewContainer.innerHTML = ''; // Clear previous previews

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = "w-32 h-32 object-cover rounded shadow";
                    previewContainer.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }
    </script>

</body>

</html>
