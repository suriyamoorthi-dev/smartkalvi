<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin News Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto bg-white shadow-lg rounded-lg p-6">
        <h1 class="text-3xl font-bold mb-6 text-center">📰 Admin News Feed</h1>

        <div class="mb-4 text-right">
            <a href="/admin/create-news" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">+ Create News</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            {% for post in posts %}
            <div class="bg-gray-50 shadow rounded p-4">
                {% if post.image_url %}
                <img src="{{ post.image_url }}" class="w-full h-48 object-cover rounded mb-3">
                {% endif %}
                <h2 class="font-bold text-xl mb-1">{{ post.title }}</h2>
                <!-- Author name -->
                <p class="text-gray-600 text-sm mb-2">By: {{ post.author }}</p>
                <p class="text-gray-700 mb-2">{{ post.description | truncate(100) }}</p>
                <div class="flex justify-between items-center text-sm text-gray-500 mb-2">
                    <span>Type: {{ post.post_type }}</span>
                    <span>📌 {% if post.is_pinned %} Yes {% else %} No {% endif %}</span>
                </div>
                <div class="flex space-x-2">
                    <a href="/admin/news/edit/{{ post.id }}">Edit</a>
<a href="/admin/delete-news/{{ post.id }}" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600" onclick="return confirm('Are you sure?')">Delete</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>

</html>
