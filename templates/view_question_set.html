<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Question Set - SmartKalvi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6">
  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow p-6">
    <h1 class="text-2xl font-bold mb-2">{{ q_set.subject }} - {{ q_set.chapter }}</h1>
    <p class="text-sm text-gray-500 mb-4">Class: {{ q_set.class }} | Marks: {{ q_set.total_marks }} | Difficulty: {{ q_set.difficulty }}</p>

    <div class="bg-gray-50 border p-4 rounded-md whitespace-pre-wrap text-gray-800">
      {{ q_set.questions | safe }}
    </div>

    <a href="{{ url_for('my_question_sets') }}" class="inline-block mt-4 bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md">
      ← Back to My Sets
    </a>
  </div>
</body>
</html>
